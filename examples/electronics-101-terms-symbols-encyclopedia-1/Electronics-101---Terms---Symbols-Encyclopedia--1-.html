<header><h1>Electronics 101 — Terms &amp; Symbols</h1>
<p class="sub">Every word you’ll hit in a first book on the foundations of electronics, in the order the ideas build.</p></header>

<footer>Sections follow a reading path from beginner to advanced. Conventional current (+ to −) is used throughout, as in most textbooks.</footer>
<script>
const S=[
["Core Quantities","The four things everything else is built from.",[
["Q","Charge","Property of matter that feels force in an electric field. Carried by electrons (−) and protons (+). Unit: coulomb (C). One electron ≈ 1.602×10⁻¹⁹ C.",""],
["I","Current","Rate of charge flow past a point. Unit: ampere (A) = 1 C/s. Conventional direction is + to −; electrons actually drift the opposite way.","I = Q / t"],
["V","Voltage","Potential difference: energy per unit charge between two points. Unit: volt (V) = 1 J/C. Always measured between two points.","V = W / Q"],
["R","Resistance","Opposition to current. Unit: ohm (Ω). Set by material, length, thickness, temperature.","R = ρL / A"],
["P","Power","Rate of energy use or delivery. Unit: watt (W) = 1 J/s.","P = VI = I²R = V²/R"],
["E, W","Energy","Capacity to do work. Unit: joule (J). Utilities bill in kWh = 3.6 MJ.","E = P·t"],
["ρ","Resistivity","Intrinsic material property behind resistance. Unit: Ω·m. Copper ≈ 1.7×10⁻⁸.",""],
["σ","Conductivity","Reciprocal of resistivity. Unit: S/m.","σ = 1/ρ"],
["G","Conductance","Reciprocal of resistance. Unit: siemens (S), formerly mho.","G = 1/R"],
["t","Time","Seconds (s). Frequency and period are its inverse partners.",""],
["T","Temperature","Kelvin (K) or °C. Resistance of metals rises with it; semiconductors usually fall.",""]]],
["Laws &amp; Theorems","The rules you use to solve every circuit.",[
["Ohm","Ohm’s Law","Current through a resistor is proportional to the voltage across it.","V = I·R"],
["KCL","Kirchhoff’s Current Law","Current entering a node equals current leaving it (conservation of charge).","ΣI_in = ΣI_out"],
["KVL","Kirchhoff’s Voltage Law","Voltages around any closed loop sum to zero (conservation of energy).","ΣV_loop = 0"],
["Joule","Joule heating","Resistive heat equals I²R. Why wires warm and fuses blow.","P = I²R"],
["Div.","Voltage divider","Two series resistors split a voltage in proportion to their values.","Vout = Vin·R2/(R1+R2)"],
["Div.","Current divider","Parallel branches split current inversely to their resistance.","I1 = It·R2/(R1+R2)"],
["Thév.","Thévenin equivalent","Any linear network seen from two terminals equals one voltage source in series with one resistor.","Vth, Rth"],
["Nort.","Norton equivalent","Same network as one current source in parallel with one resistor.","In = Vth/Rth"],
["Super.","Superposition","In a linear circuit, solve with one source at a time and add the results.",""],
["Max P","Max power transfer","A source delivers most power when load resistance equals source resistance.","RL = Rs"],
["Node V","Nodal analysis","Write KCL at each node, solve for node voltages.",""],
["Mesh","Mesh analysis","Write KVL around each loop, solve for loop currents.",""]]],
["Circuit Vocabulary","The language of schematics and wiring.",[
["—","Circuit","A closed conducting path that lets current flow. Open = broken path; closed = complete.",""],
["—","Node","A point where two or more components connect. Every wire at one potential is one node.",""],
["—","Branch / Loop","A branch carries one current between nodes; a loop is any closed path.",""],
["—","Series","Components in one chain: same current, voltages add.","Rt = R1 + R2 + …"],
["—","Parallel","Components across the same two nodes: same voltage, currents add.","1/Rt = 1/R1 + 1/R2 + …"],
["⏚","Ground (GND)","The reference node, defined as 0 V. Earth ground, chassis ground and signal ground are related but not identical.",""],
["Vcc / Vdd","Supply rail","Positive supply voltage (BJT/CMOS naming). Vee / Vss are the negative or ground rail.",""],
["—","Short circuit","Unintended near-zero-resistance path; current becomes very large.",""],
["—","Open circuit","Break in the path; zero current, full voltage across the gap.",""],
["—","Load","Whatever consumes power from the source.",""],
["—","Source","Device that supplies energy: ideal voltage source (fixed V) or current source (fixed I).",""],
["—","Dependent source","Source whose output is controlled by another voltage or current; models transistors and op-amps.",""],
["—","Schematic","Symbolic drawing of a circuit’s connections, not its physical layout. Layout of the real board is the PCB.",""],
["—","Breadboard","Solderless prototyping board with connected strips of holes.",""]]],
["Passive Components","They store, dissipate or pass energy; none provides gain.",[
["R","Resistor","Limits current and sets voltages. Marked by color bands or numbers. Tolerance e.g. ±5%.","V = IR"],
["C","Capacitor","Two plates and an insulator (dielectric); stores energy in an electric field. Unit: farad (F). Blocks DC, passes AC.","Q = CV · E = ½CV²"],
["L","Inductor","Coil that stores energy in a magnetic field. Unit: henry (H). Resists changes in current; passes DC, impedes AC.","V = L·dI/dt · E = ½LI²"],
["M","Mutual inductance / Transformer","Two coils sharing flux; steps AC voltage up or down, isolates circuits.","Vs/Vp = Ns/Np"],
["Z","Impedance","Total opposition to AC including phase. Unit: Ω. Complex number: resistance plus reactance.","Z = R + jX"],
["X","Reactance","The imaginary part of impedance; capacitors and inductors have it.","Xc = 1/(2πfC) · Xl = 2πfL"],
["B","Susceptance / Y: Admittance","Reciprocals of reactance and impedance. Handy for parallel AC networks.","Y = 1/Z"],
["pot","Potentiometer","Variable resistor with three terminals; works as an adjustable voltage divider.",""],
["τ","Time constant","Time for an RC or RL circuit to reach ~63% of its final value.","τ = RC · τ = L/R"],
["Q","Quality factor","How sharply a resonant circuit rings; also loss in a capacitor or inductor.","Q = X/R"],
["f₀","Resonance","Frequency where inductive and capacitive reactance cancel.","f₀ = 1/(2π√LC)"],
["—","Fuse / Breaker","Deliberate weak link that opens when current is too high.",""],
["—","Thermistor / LDR / Varistor","Resistors that change with temperature (NTC/PTC), light (LDR) or voltage (MOV).",""]]],
["Alternating Current","Time-varying signals and their descriptions.",[
["DC","Direct current","Current in one direction, constant or slowly varying.",""],
["AC","Alternating current","Current that reverses direction periodically, usually sinusoidally.","v(t) = Vp·sin(2πft + φ)"],
["f","Frequency","Cycles per second. Unit: hertz (Hz).","f = 1/T"],
["T","Period","Duration of one cycle, in seconds.",""],
["ω","Angular frequency","Radians per second.","ω = 2πf"],
["φ","Phase","Offset of a waveform in angle (degrees or radians). Current leads voltage in capacitors; lags in inductors.",""],
["Vp / Vpp","Peak / peak-to-peak","Maximum value from zero, and from minimum to maximum.","Vpp = 2Vp"],
["Vrms","RMS value","The DC value delivering the same heating. For a sine wave.","Vrms = Vp/√2 ≈ 0.707Vp"],
["λ","Wavelength","Distance one cycle spans in space.","λ = v/f"],
["dB","Decibel","Logarithmic ratio. +3 dB ≈ ×2 power; +20 dB = ×10 voltage.","dB = 20·log₁₀(V2/V1)"],
["BW","Bandwidth","Range of frequencies a circuit passes, usually between −3 dB points.",""],
["LPF/HPF/BPF","Filters","Low-pass, high-pass, band-pass (and notch) circuits shaping which frequencies pass.","fc = 1/(2πRC)"],
["—","Harmonic","Integer multiple of a fundamental frequency; non-sine waves contain many.",""],
["—","Waveform shapes","Sine, square, triangle, sawtooth, pulse. Duty cycle is the percent of time high.",""],
["—","Fourier / Spectrum","Any signal = sum of sines; the spectrum shows how much of each frequency.",""]]],
["Ramp 1: Complex Numbers &amp; Phasors","Step one toward Laplace: turn sinusoids into algebra.",[
["j","Imaginary unit","Defined by j² = −1. Engineers write j because i already means current.","j = √−1"],
["a+jb","Rectangular form","Real part a, imaginary part b. Best for adding and subtracting.","Re{z} = a · Im{z} = b"],
["r∠θ","Polar form","Magnitude and angle. Best for multiplying and dividing: magnitudes multiply, angles add.","r = √(a²+b²) · θ = atan2(b,a)"],
["e^jθ","Euler’s formula","Ties exponentials to sine and cosine. The reason complex numbers describe oscillation.","e^(jθ) = cosθ + j·sinθ"],
["z*","Complex conjugate","Flip the sign of the imaginary part. Multiplying by it gives magnitude squared.","z·z* = |z|²"],
["V̂","Phasor","A complex number holding the amplitude and phase of a sinusoid at one fixed frequency.","v(t) = Re{V·e^(jωt)}"],
["jω","Derivative operator","In the phasor domain differentiating becomes multiplying by jω, and integrating becomes dividing by it.","d/dt → jω · ∫dt → 1/(jω)"],
["Z","Phasor impedances","Ohm’s law for AC: resistor R, inductor jωL, capacitor 1/(jωC). Series and parallel rules work as for resistors.","V = I·Z"],
["S","Complex power","Real part is watts, imaginary part is reactive vars.","S = V·I* = P + jQ"]]],
["Ramp 2: Differential Equations &amp; Transients","Step two: what circuits do in time, before steady state.",[
["ODE","Differential equation","Equation relating a function to its derivatives. Capacitors and inductors make circuit laws into ODEs.","i = C·dv/dt · v = L·di/dt"],
["n","Order","Highest derivative; equals the number of independent energy-storing parts (capacitors, inductors).",""],
["LTI","Linear time-invariant","Output scales with input, sums add, and behavior doesn’t change over time. Laplace analysis requires it.",""],
["u(t)","Unit step","Zero before t = 0, one after. Models flipping a switch.",""],
["δ(t)","Unit impulse","Infinitely short, unit-area spike. Its response reveals a system completely.","∫δ(t)dt = 1"],
["IC","Initial conditions","A capacitor’s voltage and an inductor’s current cannot jump instantly; they carry state across t = 0.","v(0⁻) = v(0⁺)"],
["nat/forced","Natural &amp; forced response","Natural: how the circuit rings on its own (decays). Forced: what the source drives. Total = natural + forced.","y = y_n + y_f"],
["trans/ss","Transient &amp; steady state","Transient dies out; steady state remains after it’s gone.",""],
["RC step","First-order response","Capacitor charges toward the source, reaching 63% after one time constant, ~99% after five.","v(t) = Vs(1 − e^(−t/RC))"],
["RL step","RL response","Inductor current rises exponentially toward V/R.","i(t) = (V/R)(1 − e^(−Rt/L))"],
["α, ω₀","Damping coefficient, natural frequency","Series RLC: α sets decay, ω₀ sets the ring rate.","α = R/2L · ω₀ = 1/√(LC)"],
["2nd ord.","Second-order equation","Series RLC capacitor voltage obeys this.","v″ + 2α·v′ + ω₀²·v = 0"],
["ζ","Damping ratio","Over-damped ζ &gt; 1 (slow, no ring); critical ζ = 1; under-damped ζ &lt; 1 (rings and overshoots).","ζ = α/ω₀"],
["ωd","Damped frequency","Actual ring frequency when under-damped.","ωd = √(ω₀² − α²)"],
["ts/tr/Mp","Settling, rise, overshoot","Time to stay within a band (often 2%), time to go 10% to 90%, and peak above final value.",""],
["char. eq.","Characteristic equation","Plug in e^(st) to turn the ODE into a polynomial; its roots dictate the natural response.","s² + 2αs + ω₀² = 0"]]],
["Ramp 3: Frequency Response","Step three: seeing a circuit as a filter over all frequencies.",[
["H(jω)","Frequency response","Output phasor divided by input phasor as a function of ω. Complex: has magnitude and phase.","H(jω) = Vout/Vin"],
["|H|, ∠H","Magnitude &amp; phase response","Gain and phase shift at each frequency.",""],
["Bode","Bode plot","Gain in dB and phase in degrees against log frequency. Straight-line asymptotes make hand sketching easy.",""],
["dec/oct","Decade, octave","Tenfold and twofold frequency steps. First-order roll-off: −20 dB/decade (−6 dB/octave).",""],
["fc","Corner / cutoff frequency","Where gain is down 3 dB (0.707×) and phase is shifted 45°. For a first-order RC.","fc = 1/(2πRC)"],
["F(ω)","Fourier transform","Decomposes a signal into frequencies. It handles steady, repeating or decaying signals, but not growth, initial conditions or switch-on at t = 0.","F(ω) = ∫f(t)e^(−jωt)dt"],
["→ s","Why Laplace?","Replace jω with the full complex s = σ + jω to handle growth, decay, startup and initial conditions in one algebraic tool.","jω → s"]]],
["Ramp 4: The Laplace Transform","Destination: ODEs in time become algebra in s.",[
["s","Complex frequency","σ is exponential decay (or growth) rate, ω is oscillation. Units: 1/s.","s = σ + jω"],
["F(s)","Laplace transform","Weights f(t) by decaying exponentials and sums from 0 upward. Unilateral form includes initial conditions at 0⁻.","F(s) = ∫₀⁻^∞ f(t)e^(−st)dt"],
["L⁻¹","Inverse transform","Return to time. Usually done by partial fractions and a table, not by the contour integral.","f(t) = L⁻¹{F(s)}"],
["ROC","Region of convergence","Values of s for which the integral converges. Matters for uniqueness and stability.",""],
["lin.","Linearity","Constants and sums pass through the transform.","L{af + bg} = aF + bG"],
["d/dt","Derivative property","The key trick: derivatives become multiplication by s, with initial conditions folded in.","L{f′} = sF − f(0) · L{f″} = s²F − sf(0) − f′(0)"],
["∫","Integral property","Integrating becomes dividing by s.","L{∫f} = F/s"],
["shift","Time &amp; frequency shift","Delay in time multiplies by e^(−as); damping in time shifts s.","L{f(t−a)u(t−a)} = e^(−as)F · L{e^(−at)f} = F(s+a)"],
["f*g","Convolution","Output equals input convolved with impulse response; in s, a plain product.","L{f*g} = F(s)·G(s)"],
["pairs","Basic transform pairs","δ(t) ↔ 1 · u(t) ↔ 1/s · t ↔ 1/s² · tⁿ ↔ n!/sⁿ⁺¹ · e^(−at) ↔ 1/(s+a)",""],
["trig","Sine &amp; cosine pairs","Poles sit on the jω axis: pure undamped oscillation. Multiply by e^(−at) to damp: replace s with s+a.","sin ωt ↔ ω/(s²+ω²) · cos ωt ↔ s/(s²+ω²)"],
["R, sL, 1/sC","s-domain components","Impedances of resistor, inductor, capacitor. Initial conditions appear as small series sources (Li(0) for L, v(0)/s for C).","Z_R = R · Z_L = sL · Z_C = 1/(sC)"],
["H(s)","Transfer function","Output over input with zero initial conditions. A ratio of polynomials. Replacing s with jω gives the frequency response.","H(s) = Y(s)/X(s)"],
["h(t)","Impulse response","Time-domain output when the input is δ(t); equals the inverse transform of H(s).","h(t) = L⁻¹{H(s)}"],
["poles","Poles","Roots of the denominator of H(s); the values of s where it blows up. They set the natural modes of the system.",""],
["zeros","Zeros","Roots of the numerator; frequencies the system blocks.",""],
["LHP/RHP","Stability","All poles with negative real part (left half-plane): stable, decays. Any pole in the RHP: unstable, grows. On the jω axis: marginal.",""],
["p-plane","Pole map","Real poles: pure exponentials. Complex pairs: oscillation with decay σ and frequency ω. Farther left means faster decay.","e^(σt)·cos(ωt)"],
["PFE","Partial fractions","Split a rational F(s) into simple terms that are each in the table, then invert.","A/(s+a) + B/(s+b)"],
["IVT","Initial value theorem","Starting value of f(t) read straight from F(s).","f(0⁺) = lim s→∞ sF(s)"],
["FVT","Final value theorem","Steady value, valid only if all poles of sF(s) are in the LHP.","f(∞) = lim s→0 sF(s)"],
["Ex.","Worked example: RC step","Source Vs/s into H = 1/(1+sRC). Partial fractions give the familiar charging curve, in a few lines of algebra instead of solving an ODE.","Vout = Vs/[s(1+sRC)] = Vs[1/s − 1/(s+1/RC)]"],
["Next","Where to go afterwards","Root locus, Nyquist, state-space, and the Z-transform (the discrete-time cousin used in digital filters).",""]]],
["Worked Examples: Laplace in Action","Real numbers, start to finish. Series RLC: L = 1 mH, C = 1 µF, R = 20 Ω, 1 V step, output across C.",[
["1","Write H(s)","Replace parts with sL, 1/sC and R, then use the voltage divider. Compare with the standard second-order form.","H = (1/sC)/(R+sL+1/sC) = ω₀²/(s² + 2αs + ω₀²)"],
["2","Find ω₀, α, ζ","Plug in the values.","ω₀ = 31 623 rad/s · α = R/2L = 10 000 · ζ = 0.316"],
["3","Find the poles","Roots of the denominator. ζ below 1, so a complex pair in the left half-plane: stable and under-damped.","s = −α ± jωd = −10 000 ± j30 000"],
["4","Step response in s","Multiply H by the step 1/s.","Vout(s) = ω₀² / [s(s² + 2αs + ω₀²)]"],
["5","Invert","Partial fractions, then complete the square so terms match e^(−at)·cos and e^(−at)·sin.","v(t) = 1 − e^(−10⁴t)[cos(3×10⁴t) + ⅓·sin(3×10⁴t)]"],
["6","Overshoot &amp; peak time","Read the specs straight from the pole position. About 35% overshoot, peaking just over 100 µs after the step.","Mp = e^(−πζ/√(1−ζ²)) ≈ 0.35 · tp = π/ωd ≈ 105 µs"],
["7","Check with FVT","All poles of sF(s) are in the LHP, so the theorem applies. The capacitor ends at the source voltage.","lim s→0 sF(s) = 1 V"],
["A","Over-damped case","ζ above 1: two distinct real poles, −α ± √(α²−ω₀²). Response is a sum of two exponentials; no overshoot.","v = 1 + A·e^(p1t) + B·e^(p2t)"],
["B","Critically damped case","ζ = 1: a double pole at −ω₀. Fastest settling with no overshoot.","v = 1 − (1 + ω₀t)e^(−ω₀t)"],
["C","Initial conditions: RC discharge","Source-free RC with v(0) = V₀. KCL in s with the C source gives V(s); invert with the e^(−at) pair.","V(s) = V₀/(s + 1/RC) → v(t) = V₀e^(−t/RC)"]]],
["Bode Sketching Rules","Draw a frequency response by hand, one factor at a time, then add.",[
["std","Standard form","Factor H into constant K, powers of s, and terms like (1 + s/ωz) and (1 + s/ωp). Each gets its own straight-line sketch; dB values add.","H = K·(1+s/ωz)/[sⁿ(1+s/ωp)]"],
["K","Constant","Flat gain line. Phase 0° (or 180° if K is negative).","20·log₁₀|K| dB"],
["1/sⁿ","Pole at origin","Slope −20n dB/decade, passing 0 dB at ω = 1. Phase −90n°. A zero at origin is the mirror image: +20 dB/dec, +90°.",""],
["pole","Simple pole at ωp","Flat below ωp, then −20 dB/dec. Phase 0° to −90°, at −45° at ωp, ramping from 0.1ωp to 10ωp.",""],
["zero","Simple zero at ωz","Flat below ωz, then +20 dB/dec. Phase 0° to +90° over the same span.",""],
["quad","Complex pole pair","At ω₀ the slope bends to −40 dB/dec and phase goes 0° to −180°. A resonant peak appears when ζ is small, with height set by damping.","Peak ≈ 1/(2ζ) at ω₀"],
["add","Slope accumulation","Start at low frequency with the slope from the origin terms. At each corner the slope changes by ±20 dB/dec (±40 for a pair). Poles bend down, zeros bend up.",""],
["err","Straight line vs real curve","Largest error at the corner: 3 dB for a simple factor, and ~1 dB one octave away. Phase is easiest to estimate by sketching the ±45° point at each corner.",""],
["Ex.","Example","H = 1000/[(1+s/10)(1+s/1000)]: flat at 60 dB; bends to −20 dB/dec at 10 rad/s; to −40 dB/dec at 1000 rad/s. Phase falls to −90° near 100 rad/s, then to −180° past 10 000.",""]]],
["Ramp 5: Feedback &amp; Stability","Beyond Laplace: deciding whether a closed loop stays well-behaved.",[
["G, H","Feedback loop","G is the forward path, H the feedback path. Negative feedback subtracts the output from the input.","T(s) = G/(1 + GH)"],
["L(s)","Loop gain","Product around the whole loop, cut open at one point. Nearly all stability tools study this one function.","L = G·H"],
["1+L=0","Closed-loop characteristic equation","Roots are the closed-loop poles. Stability means every root in the LHP.","1 + L(s) = 0"],
["RL","Root locus","Plot of closed-loop poles as a gain K sweeps from 0 to ∞. Starts at open-loop poles, ends at zeros (or at infinity).","1 + K·N(s)/D(s) = 0"],
["RL rules","Root locus rules","Real-axis segments lie left of an odd count of poles and zeros. With n poles, m zeros: n−m branches go to infinity along asymptotes. Breakaway points where dK/ds = 0. Crossing the jω axis gives the gain limit.","Angles = (2k+1)·180°/(n−m) · centroid = (Σp − Σz)/(n−m)"],
["Routh","Routh–Hurwitz test","Check stability from polynomial coefficients without finding roots. Sign changes in the first column of the Routh array equal the number of RHP poles. For second order: all coefficients positive.",""],
["Nyq","Nyquist criterion","Plot L(jω) in the complex plane for all ω. The closed loop is stable when encirclements of the point −1 match the open-loop RHP poles. Z = N + P, N counted clockwise.","Z = N + P"],
["GM","Gain margin","How much extra gain before instability, measured where phase of L is −180°. Often quoted in dB; want 6 dB or more.","GM = 1/|L(jωpc)|"],
["PM","Phase margin","Extra phase lag tolerable at the gain crossover, where |L| = 1. Want 45°–60°. Rule of thumb ties it to damping.","PM = 180° + ∠L(jωgc) · ζ ≈ PM/100"],
["type","System type &amp; steady-state error","Type = number of pure integrators (1/s) in L. Type 0 has finite step error; type 1 follows a step exactly; type 2 follows a ramp.","e_ss = 1/(1+Kp) (step, type 0)"],
["PID","PID controller","Proportional, integral, derivative terms: present error, accumulated error, predicted trend.","C(s) = Kp + Ki/s + Kd·s"],
