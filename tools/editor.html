<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makuraba editor</title>
<style>
:root{--gold:#d9ae4c;--hi:#f4d98a;--line:rgba(217,174,76,.4);--ink:#ece7d6;--mute:#a3a9b8;--bg:#07060e;--card:#100d1a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--gold);background:#0b0914;flex:none}
header b{color:var(--hi);letter-spacing:.2em;font-size:15px}header a{color:var(--gold);font-size:14px}
#status{margin-left:auto;font-size:14px;color:var(--mute)}#status.ok{color:#6fd3a0}#status.bad{color:#ff8a8a}
#tabs{display:none;flex:none;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:none;min-height:44px}
#tabs button.on{border-bottom-color:var(--gold);color:var(--hi)}
main{flex:1;min-height:0;display:grid;grid-template-columns:310px 1fr 440px}
.pane{overflow:auto;padding:12px;border-right:1px solid var(--line);min-width:0}
#prev{padding:0;border:0;background:#000}#frame{width:100%;height:100%;border:0;display:block}
@media(max-width:1000px){main{display:block;height:100%}#tabs{display:flex}.pane{display:none;height:100%}
 body[data-t=tree] #tree,body[data-t=edit] #edit,body[data-t=prev] #prev{display:block}}
button,input,textarea,select{font:inherit;color:inherit;border-radius:0}
button{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--hi);cursor:pointer}
button:hover{border-color:var(--gold)}
input,textarea,select{width:100%;padding:8px 10px;background:#0a0814;border:1px solid var(--line);color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}input[type=file]{padding:6px}
textarea{min-height:110px;resize:vertical;line-height:1.5}.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px;min-height:150px}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
h2{margin:0 0 8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
label{display:block;margin:12px 0 4px;font-size:12.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
label.chk{display:flex;align-items:center;text-transform:none;font-size:15px;color:var(--ink);letter-spacing:0}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
.node{display:flex;align-items:center;gap:4px;min-height:44px;padding-left:calc(var(--d)*14px);border-bottom:1px solid rgba(217,174,76,.12)}
.node.on{background:rgba(217,174,76,.14)}.node .t{flex:1;min-width:0;cursor:pointer;padding:8px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .b{display:flex;gap:3px}.node .b button{min-height:34px;min-width:34px;padding:0 6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.block{margin:0 0 12px;padding:10px 12px 12px;border:1px solid var(--line);background:var(--card)}
.bh{display:flex;align-items:center;gap:4px;margin-bottom:2px}.bh span{flex:1;color:var(--hi);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.bh button{min-height:34px;min-width:34px;padding:0 6px}
.more{margin:-14px 0 24px}.more summary{cursor:pointer;color:var(--gold,#d8b45a);padding:6px 0;font-size:.9rem}.more .add{margin:6px 0 0}
.add{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 24px}.add button{min-height:38px}
.thumb{display:block;max-width:160px;max-height:120px;margin:6px 0;border:1px solid var(--line)}
.kcard{margin:8px 0;padding:8px;border:1px dashed var(--line)}.kcard .r{display:flex;gap:6px;align-items:center}.kcard input[type=number]{width:84px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--gold);padding:14px;min-width:260px;max-width:90vw}
dialog::backdrop{background:rgba(0,0,0,.7)}dialog h3{margin:0 0 10px;color:var(--hi)}dialog button{display:block;width:100%;margin:6px 0;text-align:left}
</style>
</head>
<body data-t="tree">
<header><b>MAKURABA</b><a href="/" target="_blank">open site</a><span id="status">loading</span></header>
<div id="tabs"><button data-t="tree" class="on">Structure</button><button data-t="edit">Page</button><button data-t="prev">Preview</button></div>
<main><section class="pane" id="tree"></section><section class="pane" id="edit"></section><section class="pane" id="prev"><iframe id="frame" title="Preview"></iframe></section></main>
<dialog id="dlg"></dialog><datalist id="targets"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"untitled";
const kindOf=n=>n.items?"group":n.url!==undefined?"link":"page";
let cfg,sel=null,page=null,tC,tP;
async function api(path,opt={}){const r=await fetch("/_api/"+path,{...opt,headers:{"X-Hub":"1",...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
function say(t,bad){const s=$("#status");s.textContent=t;s.className=bad?"bad":t.startsWith("Saved")?"ok":""}
function tab(t){document.body.dataset.t=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t))}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
function choose(title,opts){return new Promise(res=>{const d=$("#dlg");d.innerHTML=`<h3>${esc(title)}</h3>`+opts.map((o,i)=>`<button data-i="${i}">${esc(o[1])}</button>`).join("")+`<button data-i="x">Cancel</button>`;
 d.onclick=e=>{const b=e.target.closest("button");if(!b)return;d.close();res(b.dataset.i==="x"?null:opts[+b.dataset.i][0])};d.oncancel=()=>res(null);d.showModal()})}
function locate(path){const m=cfg.menu.find(x=>x.id===path[0]);if(!m)return null;if(path.length===1)return{m};
 let list=m.items;for(let i=1;i<path.length;i++){const n=list.find(x=>x.id===path[i]);if(!n)return null;if(i===path.length-1)return{m,list,node:n};list=n.items||[]}return null}

/* ---------- structure ---------- */
function nodes(items,path,d){return items.map(n=>{const p=[...path,n.id],k=kindOf(n);return row(p,d,k==="group"?"▾":k==="link"?"↗":"▪",n.title,k)+(k==="group"?nodes(n.items,p,d+1):"")}).join("")}
function row(p,d,ico,title,k){const on=sel&&sel.join("/")===p.join("/");
 return `<div class="node${on?" on":""}" data-p="${esc(p.join("/"))}" style="--d:${d}"><span class="t" data-a="open">${ico} ${esc(title)}</span><span class="b">`+
 (k==="group"||k==="menu"?`<button data-a="add" aria-label="Add inside">＋</button>`:"")+`<button data-a="up" aria-label="Move up">↑</button><button data-a="down" aria-label="Move down">↓</button>`+
 (k==="group"||k==="page"||k==="link"?`<button data-a="move" aria-label="Move to">⇄</button>`:"")+(k==="home"?"":`<button data-a="del" aria-label="Remove">✕</button>`)+`</span></div>`}
function renderTree(){let h=`<div class="top"><h2>Directory</h2><button data-a="menuadd">＋ Menu item</button></div>`;
 cfg.menu.forEach(m=>{h+=row([m.id],0,m.type==="home"?"⌂":"◆",m.label,m.type==="home"?"home":"menu")+(m.type==="index"?nodes(m.items,[m.id],1):"")});
 $("#tree").innerHTML=h;
 const opts=[];cfg.menu.forEach(m=>{opts.push(`<option value="${esc(m.id)}">`);for(const n of walkAll(m.items,[m.id]))if(n.page)opts.push(`<option value="${esc(n.node.slug)}">`);else if(n.group)opts.push(`<option value="${esc(n.path.join("/"))}">`)});
 $("#targets").innerHTML=opts.join("")}
function*walkAll(items,path){for(const n of items||[]){const p=[...path,n.id];if(n.items){yield{group:1,node:n,path:p};yield*walkAll(n.items,p)}else if(kindOf(n)==="page")yield{page:1,node:n,path:p}}}
async function saveCfg(){clearTimeout(tC);say("Saving…");try{const j=await api("config",{method:"PUT",body:JSON.stringify(cfg)});cfg=j.config;say("Saved"+(j.warnings&&j.warnings.length?" - "+j.warnings[0]:""));preview()}catch(e){say(e.message,1);try{cfg=(await api("config")).config}catch(_){}}renderTree()}
const scheduleCfg=()=>{say("Editing…");clearTimeout(tC);tC=setTimeout(saveCfg,900)};
$("#tree").addEventListener("click",async e=>{
 if(e.target.closest("[data-a=menuadd]")){const name=prompt("Name of the new menu item");if(!name)return;cfg.menu.push({id:slug(name),label:name,type:"index",icon:"triangle",items:[]});return saveCfg()}
 const r=e.target.closest(".node"),b=e.target.closest("[data-a]");if(!r||!b)return;const p=r.dataset.p.split("/"),a=b.dataset.a,L=locate(p);if(!L)return;
 const arr=p.length===1?cfg.menu:L.list,item=p.length===1?L.m:L.node;
 if(a==="open")return select(p);
 if(a==="up"||a==="down"){const i=arr.indexOf(item),j=i+(a==="up"?-1:1);if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];return saveCfg()}
 if(a==="del"){const inner=(item.items||[]).length;if(!confirm(`Remove "${item.title||item.label}"${inner?` and the ${inner} item(s) inside it`:""}?\nPage files stay in pages/ and media/.`))return;arr.splice(arr.indexOf(item),1);if(sel&&sel.join("/").startsWith(p.join("/")))sel=null,page=null;await saveCfg();return renderEdit()}
 if(a==="add"){const t=await choose("Add inside “"+(item.title||item.label)+"”",[["group","Group (holds more items)"],["page","Page"],["link","Link"]]);if(!t)return;
  const name=prompt(t==="group"?"Group name":t==="page"?"Page title":"Link title");if(!name)return;const id=slug(name),n={id,title:name};
  if(t==="group")n.items=[];else if(t==="page")n.slug=id;else{n.url=prompt("URL, e.g. https://example.com")||""}
  if(item.items.some(x=>x.id===id))return say("That name already exists here",1);item.items.push(n);const np=[...p,id];await saveCfg();return t==="group"?renderTree():select(np)}
 if(a==="move"){const dests=[];cfg.menu.filter(m=>m.type==="index").forEach(m=>{dests.push([[m.id],"◆ "+m.label]);for(const g of walkAll(m.items,[m.id]))if(g.group&&!g.path.join("/").startsWith(p.join("/")))dests.push([g.path,"   ".repeat(g.path.length-1)+"▾ "+g.node.title])});
  const d=await choose("Move “"+item.title+"” to",dests.map(x=>[x[0].join("/"),x[1]]));if(!d)return;const dl=locate(d.split("/")),target=dl.node?dl.node.items:dl.m.items;
  if(target.some(x=>x.id===item.id))return say("That name already exists there",1);arr.splice(arr.indexOf(item),1);target.push(item);sel=[...d.split("/"),item.id];await saveCfg();return select(sel)}
});

/* ---------- selection and page panel ---------- */
async function select(p){sel=p;page=null;const L=locate(p);renderTree();
 if(L&&L.node&&kindOf(L.node)==="page"){try{const j=await api("page?slug="+encodeURIComponent(L.node.slug));page={slug:L.node.slug,blocks:j.blocks,src:j.source}}catch(e){say(e.message,1)}}
 renderEdit();preview();tab("edit")}
function preview(){const f=$("#frame");if(!sel){f.src="/index.html?v="+Date.now();return}
 f.src=page?`/pages/${page.slug}.html?v=${Date.now()}`:`/index.html?v=${Date.now()}#${sel.join("/")}`}
const fld=(l,n,v,ph="")=>`<label>${l}</label><input data-n="${n}" value="${esc(v)}" placeholder="${esc(ph)}">`;
function renderEdit(){const el=$("#edit");if(!sel){el.innerHTML='<p class="hint">Pick an item in Structure, or add one with ＋. Pages open here for editing.</p>';return}
 const L=locate(sel);if(!L){el.innerHTML="";return}
 if(!L.node){el.innerHTML=`<h2>Menu item</h2>${fld("Label","label",L.m.label)}<p class="hint">Add pages and groups with ＋ in Structure.</p>`;return}
 const n=L.node,k=kindOf(n);
 let h=`<h2>${k==="page"?"Page":k==="group"?"Group":"Link"}</h2>${fld("Title","title",n.title)}${fld("Summary (shown in lists)","summary",n.summary||"")}`;
 if(k!=="group")h+=fld("Status (optional, e.g. draft)","status",n.status||"");
 if(k==="link")h+=fld("URL","url",n.url);
 if(k==="page"){h+=`<p class="hint">File: pages/${esc(n.slug)}.html${page&&page.src==="html"?" · existing hand-written content was loaded as one Raw HTML block":""}</p><h2 style="margin-top:18px">Content</h2><div id="blocks"></div>
 <div class="add">${CORE.map(t=>`<button data-add="${t}">＋ ${TYPES[t]}</button>`).join("")}</div><details class="more"><summary>More blocks</summary><div class="add">${Object.keys(TYPES).filter(t=>!CORE.includes(t)).map(t=>`<button data-add="${t}">＋ ${TYPES[t]}</button>`).join("")}</div></details>`}
 el.innerHTML=h;if(k==="page")renderBlocks()}
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!sel)return;
 if(t.dataset.n){const L=locate(sel),o=L.node||L.m;o[t.dataset.n]=t.value;renderTree();return scheduleCfg()}
 if(t.dataset.b!=null&&page){const blk=page.blocks[+t.dataset.b],v=t.type==="checkbox"?t.checked:t.value;
  if(t.dataset.k!=null)blk.items[+t.dataset.k][t.dataset.f]=v;else blk[t.dataset.f]=v;schedulePage()}});

/* ---------- blocks ---------- */
const CORE=["heading","text","image","link","divider"];
const TYPES={heading:"Heading",sub:"Subtitle",text:"Text",image:"Picture",split:"Text + picture",quote:"Quote",keys:"Medallion list",link:"Link card",embed:"Embed (3D, HTML)",divider:"Divider",html:"Raw HTML"};
const NEW={heading:()=>({text:"",level:2}),sub:()=>({text:""}),text:()=>({text:"",dropcap:false}),image:()=>({file:"",alt:"",caption:""}),split:()=>({text:"",dropcap:false,file:"",alt:"",caption:"",flip:false}),
 quote:()=>({text:"",cite:""}),keys:()=>({items:[{title:"",text:"",hue:275}]}),link:()=>({target:"",label:"",note:""}),embed:()=>({url:"",title:""}),divider:()=>({}),html:()=>({html:""})};
const inp=(i,f,v,ph="")=>`<input data-b="${i}" data-f="${f}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const area=(i,f,v,ph="",c="")=>`<textarea data-b="${i}" data-f="${f}" class="${c}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const chk=(i,f,v,l)=>`<label class="chk"><input type="checkbox" data-b="${i}" data-f="${f}"${v?" checked":""}>${l}</label>`;
const pic=(i,b)=>`<label>Picture</label>${b.file?`<img class="thumb" src="/${esc(b.file)}" alt="">`:""}<input type="file" accept="image/*" data-up="${i}">${inp(i,"alt",b.alt,"Alt text: describe the picture")}${inp(i,"caption",b.caption,"Caption (optional)")}`;
function blockBody(b,i){switch(b.type){
 case"heading":return inp(i,"text",b.text,"Heading")+`<select data-b="${i}" data-f="level"><option value="2"${b.level!=3?" selected":""}>Section heading</option><option value="3"${b.level==3?" selected":""}>Small heading</option></select>`;
 case"sub":return inp(i,"text",b.text,"Realms · Islands · Aspects");
 case"text":return area(i,"text",b.text,"Write here. Markdown works. Link another page with [[page-name]] or [[page-name|your words]].")+chk(i,"dropcap",b.dropcap,"Drop cap on the first paragraph");
 case"image":return pic(i,b);
 case"split":return area(i,"text",b.text,"Text")+chk(i,"dropcap",b.dropcap,"Drop cap")+pic(i,b)+chk(i,"flip",b.flip,"Picture first");
 case"quote":return area(i,"text",b.text,"Quote")+inp(i,"cite",b.cite,"Source (optional)");
 case"keys":return b.items.map((k,j)=>`<div class="kcard"><div class="r"><input data-b="${i}" data-k="${j}" data-f="title" value="${esc(k.title)}" placeholder="Name"><input type="number" min="0" max="360" data-b="${i}" data-k="${j}" data-f="hue" value="${esc(k.hue)}" title="Colour (hue 0-360)"><button data-op="kdel" data-b="${i}" data-k="${j}" aria-label="Remove entry">✕</button></div><textarea data-b="${i}" data-k="${j}" data-f="text" placeholder="Description" style="min-height:70px">${esc(k.text)}</textarea></div>`).join("")+`<button data-op="kadd" data-b="${i}">＋ Entry</button>`;
 case"link":return `<label>Goes to (page name, group path, or URL)</label><input list="targets" data-b="${i}" data-f="target" value="${esc(b.target)}" placeholder="root-design or https://…">`+inp(i,"label",b.label,"Title (leave empty to use the page title)")+inp(i,"note",b.note,"Note (optional)");
 case"embed":return inp(i,"url",b.url,"https://… or examples/my-demo/index.html")+inp(i,"title",b.title,"Short title for screen readers");
 case"divider":return '<p class="hint">A thin gold line.</p>';
 case"html":return area(i,"html",b.html,"<p>…</p>","mono")}return""}
function renderBlocks(){if(!page)return;$("#blocks").innerHTML=page.blocks.length?page.blocks.map((b,i)=>`<div class="block"><div class="bh"><span>${TYPES[b.type]||b.type}</span><button data-op="up" data-b="${i}" aria-label="Move up">↑</button><button data-op="down" data-b="${i}" aria-label="Move down">↓</button><button data-op="del" data-b="${i}" aria-label="Remove block">✕</button></div>${blockBody(b,i)}</div>`).join(""):'<p class="hint">No content yet. Add a block below.</p>'}
async function savePage(){if(!page)return;clearTimeout(tP);say("Saving…");try{const j=await api("page?slug="+page.slug,{method:"PUT",body:JSON.stringify({blocks:page.blocks})});say("Saved"+(j.warnings&&j.warnings.length?" - "+j.warnings[0]:""));preview()}catch(e){say(e.message,1)}}
const schedulePage=()=>{say("Editing…");clearTimeout(tP);tP=setTimeout(savePage,900)};
$("#edit").addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a&&page){page.blocks.push({type:a.dataset.add,...NEW[a.dataset.add]()});renderBlocks();schedulePage();return}
 const o=e.target.closest("[data-op]");if(!o||!page)return;const i=+o.dataset.b,op=o.dataset.op,bl=page.blocks;
 if(op==="del"){if(!confirm("Remove this block?"))return;bl.splice(i,1)}
 else if(op==="up"||op==="down"){const j=i+(op==="up"?-1:1);if(j<0||j>=bl.length)return;[bl[i],bl[j]]=[bl[j],bl[i]]}
 else if(op==="kadd")bl[i].items.push({title:"",text:"",hue:40});else if(op==="kdel")bl[i].items.splice(+o.dataset.k,1);
 renderBlocks();schedulePage()});
$("#edit").addEventListener("change",async e=>{const t=e.target;if(t.dataset.up==null||!t.files[0]||!page)return;const f=t.files[0],i=+t.dataset.up;say("Uploading…");
 try{const j=await api(`upload?slug=${encodeURIComponent(page.slug)}&name=${encodeURIComponent(f.name)}`,{method:"POST",body:f});page.blocks[i].file=j.path;renderBlocks();savePage()}catch(err){say(err.message,1)}});
addEventListener("visibilitychange",()=>{if(document.hidden){if(tP)savePage();if(tC)saveCfg()}});
(async()=>{try{cfg=(await api("config")).config;say("Ready");renderTree();renderEdit();preview()}catch(e){say(e.message,1)}})();
</script>
</body>
</html>
